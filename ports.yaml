      to match current state.
      2026-09-17: dos_status unchanged (PLAYABLE). Since the prep
      session: Game porting framework claimed (F1-F5; 5 Days a Stranger
      and Maniac Mansion Deluxe sourced -- MMD from a named Internet
      Archive mirror by operator decision, its developer site is dead --
