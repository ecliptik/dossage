    upstream_url: https://github.com/jasonrohrer/Passage
    upstream_revision: 2f713f261dc907f6feda106ebbee0464eeab791d
    upstream_license: public domain
    upstream_license_verified: true
    port_repo_url: https://github.com/ecliptik/dossage
    language: C
    original_sdl_version: "1.2"
    target_sdl_version: "3"
    graphics_api: software
    dos_status: OPTIMIZING
    # 2026-09-05: full 3-card x 4-CPU real-hardware matrix (Mach64, ViRGE,
    # Cirrus x 486DX2-50, 486DX2-66, Am5x86-133, Pentium OverDrive 83 --
    # twelve pairings) CLOSED, 12/12 PASS against the 14.90fps KPI line,
    # on the merged dx2-50-15fps fix build (build_sha12=a5e9835f12e7).
    # Superseded the 2026-08-31 single-point figure below and resolved
    # that entry's open Mach64-vs-current-build question -- all twelve
    # cells, Mach64 included, now run the same current build. gallery/
    # dossage/ entry added same day. Still not RELEASE_READY: no
    # release/dist packaging step yet. See gallery/dossage/README.md and
    # dossage's own docs/BENCHMARK-PLAN.md for the full campaign.
    #
    # 2026-08-31 (superseded above): real-hardware validated end to end on
    # 486DX2-66/PicoGUS/Cirrus CL-GD5430 (14.94fps, up from 13.992, KPI
    # campaign closed honestly short of a 15.000 target). Kept for
    # history; see the 2026-09-05 note above for current status.
    priority: 8
    difficulty: 1
    dos_minimum_target: 486DX2-50
    dos_recommended_target: 486DX2-50
    maintainer: ecliptik
    notes: >
      Port repo is "dossage" (portmanteau, matches doskutsu's DOS+game
      naming convention; binary DOSSAGE.EXE). Tiny reference/skeleton port
      covering init/video/keyboard/timer/audio/filesystem/shutdown
      end-to-end -- intended to become the copy-paste starting skeleton in
      templates/ once ported. upstream_url/upstream_revision verified by
      cloning jasonrohrer/Passage directly (author's own GitHub account;
      only 2 commits, "Exported latest revision from sourceforge cvs" --
      this is the actual upstream, not a fork or mirror).
      upstream_license verified against the author's own project page
      (https://hcsoftware.sourceforge.net/passage/), which states
      "Placed in the public domain" -- no LICENSE file ships in the source
      tree itself, so the project homepage is the recorded verification
      source (quoted, with URL, in dossage's own LICENSE-REVIEW.md).
      Build dependency: Jason Rohrer's own minorGems utility library
      (https://github.com/jasonrohrer/minorGems), also public domain
      (verified via its own in-repo no_copyright.txt, dated 2018 -- an
      actual file in the pinned tree, stronger verification than
      Passage's own). Only a small subset of minorGems is used (file/path,
      string, settings, time, thread, sha1, TGA image decode, simple
      vector) -- the rest of that large multi-project library (portaudio,
      miniupnpc, network/p2p code, etc.) is irrelevant here and should not
      be vendored/built. Engine surface is unusually small even for
      difficulty:1: raw SDL 1.2 only, no SDL_mixer (custom sample-level
      software synth audio), no SDL_image (custom uncompressed .tga
      decoder in minorGems), no font library (bitmap numerals). Only
      Thread use is Thread::staticSleep() -- trivially compatible with the
      SDL3-DOS cooperative-scheduler / threading-zero invariant doskutsu
      established. Source-verified KPI: gameSource/game.cpp defines
      `int lockedFrameRate = 15;` -- the original design targets 15 fps,
      not Cave Story's 50 fps, so this port's KPI is ~15 fps sustained on
      the 486DX2-50/486DX2-66 tier rather than doskutsu's 25-30 fps bar.
      Unlike doskutsu, engine AND game assets are both public domain from
      the same author, so (unlike Cave Story's freeware-not-redistributed
      data) there is no legal blocker to shipping the assets in this repo
      -- LICENSE-REVIEW.md still documents this properly rather than
      skipping the paperwork because the answer is permissive.
      2026-08-26: BOOTSTRAP -> PLAYABLE in one session. SDL 1.2 -> SDL3
      migration (patches/passage/0001) plus DJGPP platform shims for
      minorGems' Path/Time/Thread (patches/minorgems/0001) compiled and
      linked clean on the first attempt after two small fixes (a DJGPP
      branch for minorGems' endian.h, and defining
      g_pixtone_active_count -- an engine-provided extern the shared
      SDL3-DOS Sound Blaster backend requires regardless of engine).
      Verified under DOSBox-X (build/stage, lfn=true pending an 8.3-
      rename follow-up -- several of Passage's own asset filenames
      exceed 8.3): title screen renders correctly and gameplay (maze
      corridor, player sprite, treasure chests) is visibly correct and
      responds to keyboard input. Full CPU/video/sound matrix sweep
      (doskutsu's own matrix) planned once optimized, per operator
      direction.
      2026-08-26 (later same day): found + fixed a real bug (missing
      SDL_INIT_AUDIO -- SDL3's SDL_OpenAudioDeviceStream doesn't
      self-init the audio subsystem the way SDL1.2's SDL_OpenAudio did),
      confirmed via temporary instrumentation that the synthesis math
      produces sane non-zero PCM (real audibility deferred to real-HW --
      DOSBox-X in this dev environment pre-buffers audio far ahead of
      real-time under cycles=max and never conclusively demonstrated
      playback). Completed the 8.3-rename follow-up
      (patches/passage/0002): all asset/settings filenames renamed,
      lfn flipped back to false, reverified. Attempted sdldos's
      g_pixtone_active_count -> g_dos_sfx_synth_active_count rename +
      submodule bump to 9e9c5a8, but that hub commit's SDL patch series
      fails to apply against this port's pinned SDL SHA -- reported,
      reverted, submodule held at bf10f15 pending a hub-side fix. Handed
      off to vcctrl for this port's first real-hardware pass.
      2026-09-05: the 486DX2-50 (this port's own minimum-target CPU) fix-
      validation arc CLOSED on real hardware (branch dx2-50-15fps, merged
      to main as 2881cfc) at 14.99fps average, and the follow-on 3-card x
      4-CPU matrix (Mach64/ViRGE/Cirrus x 486DX2-50/486DX2-66/Am5x86-133/
      Pentium OverDrive 83, twelve pairings) CLOSED clean: every cell
      PASSes the 14.90fps KPI line on the merged build
      (build_sha12=a5e9835f12e7), clustered 14.97-15.02fps -- expected,
      since Passage's own pacer targets a fixed 15fps ceiling rather than
      uncapped throughput, not a sign CPU/card choice doesn't matter. A
      reproducible "one second over" effect (a 4475-frame life landing at
      299s instead of 298s on some CPU/card pairings) does not reduce to
      CPU tier, video path, or framebuffer size alone and never threatens
      the KPI -- full characterization, including two overclaims about
      its cause corrected mid-campaign, in dossage's own
      docs/BENCHMARK-PLAN.md. This closes the 2026-08-31 note's open
      Mach64-vs-current-build question (patch 0029's MAX_BPP change no
      longer leaves Mach64 unverified against the current build) and adds
      gallery/dossage/README.md. Remaining before RELEASE_READY: dist
      packaging (binary + CWSDPMI + license texts) only.

